appId: com.localapiwebproxy.app
productName: LocalAPIWebProxy

directories:
  buildResources: resources
  output: dist

# ASAR unpacked — server.js reads static files from disk via fs.readFile,
# which works fine inside an ASAR, but leaving it unpacked makes debugging
# trivial and avoids surprises around __dirname + ASAR paths.
asar: false

files:
  - electron/**/*
  - server.js
  - public/**/*
  - resources/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/*.md"
  - "!node_modules/**/{test,tests,__tests__,example,examples,docs}/**"
  - "!test/**"
  - "!certs/**"
  - "!dist/**"
  - "!**/.DS_Store"
  - "!**/.vscode/**"
  - "!**/.claude/**"

extraMetadata:
  main: electron/main.js

# ── Windows ─────────────────────────────────────────────────────────────────
# .ico is generated by scripts/generate-icon.js (multi-size 16/24/32/48/64/128/256).
# NSIS MUI_ICON requires a real .ico — won't accept PNG.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

# ── macOS (arm64 dmg — default, matches local-filesync) ─────────────────────
# electron-builder auto-generates icon.icns from resources/icon.png
mac:
  target:
    - target: dmg
      arch: [arm64]
  notarize: false
  category: public.app-category.developer-tools
  icon: resources/icon.png

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

# ── Linux ───────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  icon: resources/icon.png

appImage:
  artifactName: ${name}-${version}.${ext}
